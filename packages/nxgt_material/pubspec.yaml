name: nxgt_material
description: >-
  Material 3 components for Flutter that fill what the framework leaves out:
  adaptive layout, fields and forms, feedback states, themes. Intent-named,
  accessible, French and English.
version: 0.0.1
homepage: https://github.com/softistx/nxgt-flutter/tree/develop/packages/nxgt_material
repository: https://github.com/softistx/nxgt-flutter
issue_tracker: https://github.com/softistx/nxgt-flutter/issues
documentation: https://github.com/softistx/nxgt-flutter/tree/develop/packages/nxgt_material/doc

topics:
  - material-design
  - widgets
  - ui
  - forms
  - localization

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  alchemist: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  generate: true

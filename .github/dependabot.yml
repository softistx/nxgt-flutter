# Weekly dependency updates, one grouped PR per ecosystem, into develop.
# The pub workspace resolves in one root pubspec.lock, so pub is tracked from
# the root only; add member directories once a run shows they are reached
# without duplicate or failing updates.
version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

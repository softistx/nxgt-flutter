name: package
description: >-
  A new publishable package (Flutter by default, pure Dart with flutter=false) for the workspace, with the nxgt_material
  layout: one library per category under lib/, a barrel, tests, README,
  CHANGELOG and doc/. Run from the repository root; then add the package to
  the root pubspec.yaml `workspace:` list.
version: 0.1.0+1

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: The package name, snake_case (nxgt_http).
    prompt: Package name (snake_case, e.g. nxgt_http)?
  description:
    type: string
    description: One sentence for the pub.dev page.
    prompt: Description?
    default: A new nxgt-flutter package.
  flutter:
    type: boolean
    description: >-
      true for a Flutter package (Flutter SDK, flutter_test); false for a pure
      Dart package (package:test, no platforms list).
    prompt: Does the package depend on the Flutter SDK?
    default: true

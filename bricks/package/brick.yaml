name: package
description: >-
  A new publishable Flutter package for the workspace, with the nxgt_material
  layout: one library per category under lib/, a barrel, tests, README,
  CHANGELOG and docs. Run from the repository root; then add the package to
  the root pubspec.yaml `workspace:` list.
version: 0.1.0+1

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: The package name, snake_case (nxgt_http).
    prompt: Package name (snake_case, e.g. nxgt_http)?
  description:
    type: string
    description: One sentence for the pub.dev page.
    prompt: Description?
    default: A new nxgt-flutter package.
